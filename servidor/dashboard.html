<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rotor Testbench - Dashboard</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        th, td { text-align: left; padding: 4px 32px 4px 0; }
        button { margin: 4px 8px 4px 0; padding: 6px 14px; }
        #message { color: #b3261e; }
    </style>
</head>
<body>
    <h1>Rotor Testbench</h1>

    <h2>State</h2>
    <table>
        <tr><th>Bench</th>   <td id="bench">-</td></tr>
        <tr><th>ESC</th>     <td id="esc">-</td></tr>
        <tr><th>Mode</th>    <td id="mode">-</td></tr>
        <tr><th>Motor</th>   <td id="motor">-</td></tr>
        <tr><th>Battery</th> <td id="battery">-</td></tr>
        <tr><th>Pot</th>     <td id="pot">-</td></tr>
    </table>

    <h2>Control</h2>
    <p>
        <button onclick="post('/unlock')">UNLOCK</button>
        <button onclick="post('/stop')">STOP</button>
        (after UNLOCK, hold the button on the bench for 2 s)
    </p>
    <p>
        Mode:
        <button onclick="post('/mode', {mode: 'SERVER'})">SERVER</button>
        <button onclick="post('/mode', {mode: 'POT'})">POT</button>
        (only with the bench LOCKED)
    </p>
    <p>
        Motor:
        <input id="percent" type="number" min="0" max="50" value="0" style="width: 60px"> %
        <button onclick="post('/motor', {percent: Number(document.getElementById('percent').value)})">SET</button>
        <button onclick="post('/motor', {percent: 0})">0 %</button>
        (SERVER mode, bench UNLOCKED, max 50 %)
    </p>
    <p id="message"></p>

    <script>
        // Pergunta o estado ao servidor e mostra-o na tabela. Corre a cada 500 ms.
        // (É também o sinal de vida da página: se parar 2 s com o banco UNLOCKED, o servidor manda STOP.)
        async function refresh() {
            try {
                const r = await fetch("/status");
                const s = await r.json();
                if (!r.ok) { show(s.detail); return; }
                const b = s.bench;
                document.getElementById("bench").textContent = [b.state, b.reason, ...b.problems].filter(x => x).join(" ");
                document.getElementById("esc").textContent = s.esc;
                document.getElementById("mode").textContent = s.mode;
                document.getElementById("motor").textContent = s.motor + " %";
                document.getElementById("battery").textContent = s.battery.state + "  " + s.battery.voltage.toFixed(2) + " V";
                document.getElementById("pot").textContent = s.pot;
            } catch (e) {
                show("no answer from the server");
            }
        }

        // Envia uma ordem (POST) e mostra o erro, se houver
        async function post(url, body) {
            const r = await fetch(url, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(body || {}),
            });
            const answer = await r.json();
            show(r.ok ? "" : answer.detail);
            refresh();
        }

        function show(text) {
            document.getElementById("message").textContent = text || "";
        }

        refresh();
        setInterval(refresh, 500);
    </script>
</body>
</html>
